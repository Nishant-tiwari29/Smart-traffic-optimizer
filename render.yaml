services:
  - type: web
    name: smart-traffic-route-optimizer
    runtime: python
    rootDir: backend
    buildCommand: >-
      python -m pip install -r requirements.txt &&
      g++ -std=c++17 -O2 -Wall -Wextra
      ../cpp/main.cpp ../cpp/Graph.cpp ../cpp/TrafficModel.cpp
      ../cpp/Dijkstra.cpp ../cpp/AStar.cpp ../cpp/RouteOptimizer.cpp
      -o route_engine
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ROUTE_ENGINE_PATH
        value: ./route_engine
